<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on Pines</title>
<style>
  :root{--bg:#F5F5F5;--card:#FFFFFF;--ink:#0A0A0A;--ink2:#555;--accent:#D6004F;--line:rgba(0,0,0,.08)}
  @media(prefers-color-scheme:dark){:root{--bg:#0A0A0A;--card:#161616;--ink:#FAFAFA;--ink2:#A1A1AA;--accent:#FF1B6B;--line:rgba(255,255,255,.1)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;max-width:380px;width:100%;text-align:center}
  h1{font-size:24px;margin:0 0 8px}
  p{color:var(--ink2);line-height:1.5;margin:0 0 20px;font-size:15px}
  .code{display:inline-flex;gap:6px;margin:4px 0 22px}
  .code span{width:38px;height:48px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
             display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
        padding:15px;border-radius:14px;margin-bottom:10px}
  a.alt{display:block;color:var(--ink2);text-decoration:underline;font-size:14px;padding:8px}
  .hint{font-size:13px;color:var(--ink2);margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <h1>You've been invited</h1>
    <p>Your partner wants to link up with you on Pines.</p>
    <div class="code" id="code"></div>
    <a class="btn" id="open" href="#">Open in Pines</a>
    <a class="alt" id="store" href="https://apps.apple.com/app/id6809865174">Don't have the app? Get it here</a>
    <p class="hint">Already signed up? Enter the code above at the "I have a code" step.</p>
  </div>
<script>
  var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  var box = document.getElementById('code');
  if (code) {
    code.split('').forEach(function (ch) {
      var el = document.createElement('span'); el.textContent = ch; box.appendChild(el);
    });
  } else {
    box.style.display = 'none';
  }
  var deep = 'pines://join?code=' + encodeURIComponent(code);
  document.getElementById('open').href = deep;

  // Try the app first; if nothing takes over the page, fall back to the App Store.
  if (code) {
    var start = Date.now();
    var timer = setTimeout(function () {
      if (document.hidden) return;              // app opened, page went to background
      if (Date.now() - start < 2500) return;    // clock skew guard
      location.href = document.getElementById('store').href;
    }, 1200);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) clearTimeout(timer);
    });
    location.href = deep;
  }
</script>
</body>
</html>
